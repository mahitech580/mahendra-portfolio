name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static and Chromium checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run static source checks
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: npm run test:e2e
      - name: Upload test evidence when checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
